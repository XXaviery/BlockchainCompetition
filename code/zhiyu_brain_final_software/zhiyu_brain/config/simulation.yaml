version: indoor_sim_v1
episodes_per_scenario: 12
steps_per_episode: 90
sample_interval_seconds: 30
sensor_noise:
  pm25_sd: 1.8
  voc_sd: 8.0
  co2_sd: 12.0
  temperature_sd: 0.15
  humidity_sd: 0.35
missing_probability: 0.01
abnormal_probability: 0.003
diffusion_rate: 0.012
natural_decay:
  pm25: 0.010
  voc: 0.007
  co2: 0.002
purification_decay:
  pm25: 0.080
  voc: 0.045
  co2: 0.0
