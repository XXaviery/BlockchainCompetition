[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyu-brain"
version = "0.1.0"
description = "智驭新风环境风险预测与安全任务调度软件工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "xgboost>=3.0",
  "PyYAML>=6.0",
  "matplotlib>=3.9",
  "shap>=0.48",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zhiyu-brain-demo = "scripts.run_demo:main"
zhiyu-brain-gui = "scripts.run_gui:main"
zhiyu-brain-export-evidence = "scripts.export_report_evidence:main"
zhiyu-brain-evaluate = "scripts.evaluate_models:main"

[tool.setuptools]
include-package-data = true
packages = [
  "app",
  "scripts",
  "services",
  "ui",
  "ui.pages",
  "ui.widgets",
  "zhiyu_brain",
  "zhiyu_brain.adapters",
  "zhiyu_brain.common",
  "zhiyu_brain.decision",
  "zhiyu_brain.interfaces",
  "zhiyu_brain.labels",
  "zhiyu_brain.logging",
  "zhiyu_brain.models",
  "zhiyu_brain.runtime",
  "zhiyu_brain.safety",
  "zhiyu_brain.sensing",
  "zhiyu_brain.simulation",
  "zhiyu_brain.state",
  "zhiyu_brain.task",
]

[tool.setuptools.package-dir]
app = "app"
scripts = "scripts"
services = "services"
ui = "ui"
"ui.pages" = "ui/pages"
"ui.widgets" = "ui/widgets"
zhiyu_brain = "src/zhiyu_brain"
"zhiyu_brain.adapters" = "src/zhiyu_brain/adapters"
"zhiyu_brain.common" = "src/zhiyu_brain/common"
"zhiyu_brain.decision" = "src/zhiyu_brain/decision"
"zhiyu_brain.interfaces" = "src/zhiyu_brain/interfaces"
"zhiyu_brain.labels" = "src/zhiyu_brain/labels"
"zhiyu_brain.logging" = "src/zhiyu_brain/logging"
"zhiyu_brain.models" = "src/zhiyu_brain/models"
"zhiyu_brain.runtime" = "src/zhiyu_brain/runtime"
"zhiyu_brain.safety" = "src/zhiyu_brain/safety"
"zhiyu_brain.sensing" = "src/zhiyu_brain/sensing"
"zhiyu_brain.simulation" = "src/zhiyu_brain/simulation"
"zhiyu_brain.state" = "src/zhiyu_brain/state"
"zhiyu_brain.task" = "src/zhiyu_brain/task"

[tool.pytest.ini_options]
testpaths = ["tests"]
