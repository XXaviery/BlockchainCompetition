<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Pollution simulation map demo</title>
  <desc id="desc">A deterministic software-in-the-loop preview of four indoor regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="hot" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".88"/>
      <stop offset=".58" stop-color="#ef4444" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#facc15" stop-opacity=".86"/>
      <stop offset=".58" stop-color="#fb923c" stop-opacity=".52"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".82"/>
      <stop offset=".58" stop-color="#06b6d4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="420" rx="28" fill="url(#bg)"/>
  <text x="36" y="42" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">污染态势仿真演示</text>
  <text x="36" y="68" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">SIMULATION / SOFTWARE-IN-THE-LOOP · STEP 05</text>
  <rect x="80" y="102" width="560" height="250" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
  <path d="M360 102v250M80 227h560" stroke="#475569" stroke-width="2"/>
  <circle cx="220" cy="164" r="118" fill="url(#cool)"/>
  <circle cx="500" cy="164" r="118" fill="url(#warm)"/>
  <circle cx="220" cy="290" r="118" fill="url(#hot)"/>
  <circle cx="500" cy="290" r="118" fill="url(#warm)"/>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="104" y="132">A</text><text x="384" y="132">B</text>
    <text x="104" y="257">C</text><text x="384" y="257">D</text>
  </g>
  <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="11">
    <text x="104" y="150">客厅</text><text x="384" y="150">卧室</text>
    <text x="104" y="275">厨房</text><text x="384" y="275">工作区</text>
  </g>
  <g transform="translate(100 378)" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">
    <circle cx="0" cy="-4" r="7" fill="#22c55e"/><text x="14" y="0">低风险</text>
    <circle cx="95" cy="-4" r="7" fill="#facc15"/><text x="109" y="0">中风险</text>
    <circle cx="195" cy="-4" r="7" fill="#ef4444"/><text x="209" y="0">高风险</text>
    <text x="390" y="0" fill="#94a3b8">演示数据 · 非实机传感器读数</text>
  </g>
</svg>
