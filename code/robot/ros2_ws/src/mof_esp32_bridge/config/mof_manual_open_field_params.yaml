velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # Supervised open-field mode only. Production Nav2 remains capped at
    # 0.15 m/s in mof_nav2_params.yaml.
    max_velocity: [0.50, 0.60, 1.00]
    min_velocity: [-0.50, -0.60, -1.00]
    max_accel: [1.5, 1.5, 1.0]
    max_decel: [-1.5, -1.5, -1.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
