ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    # Keep publishing/predicting at the configured filter rate even though
    # wheel odometry measurements arrive at about 20 Hz.
    predict_to_current_time: true
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    publish_tf: true
    publish_acceleration: false

    # Navigation isolation mode: use wheel twist only. In particular,
    # wheel pose/yaw is not fused, and no IMU input is configured here.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    use_control: false
